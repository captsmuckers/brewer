name: Release

# Tag a version and walk away: each platform is built on its own runner and the
# finished artifacts are attached to the release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't throw away the other's output.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            command: dist:linux
          - name: Windows
            os: windows-latest
            command: dist:win

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `--publish never` keeps electron-builder from uploading on its own:
      # publishing is the release job's business, and a tag push plus a token
      # is enough for it to try otherwise.
      - name: Build
        run: npm run ${{ matrix.command }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.pacman
            dist/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check the tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::package.json is $VERSION but the tag is $TAG"
            exit 1
          fi

      - name: List what will be published
        run: ls -lh artifacts

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "Brewer ${TAG#v}" \
              --notes-file .github/release-body.md
          fi
